name: Information Dividend OS CI

on:
  push:
    paths:
      - 'app/information-dividend.html'
      - 'app/supervisor.html'
      - 'contracts/information-dividend-system.json'
      - 'data/information-dividend/**'
      - 'docs/information-dividend-os/**'
      - 'supabase/functions/ido-supervisor/**'
      - 'supabase/migrations/*information_dividend*'
      - 'tests/information-dividend-contract.test.mjs'
      - '.github/workflows/information-dividend-ci.yml'
  pull_request:
    paths:
      - 'app/information-dividend.html'
      - 'app/supervisor.html'
      - 'contracts/information-dividend-system.json'
      - 'data/information-dividend/**'
      - 'docs/information-dividend-os/**'
      - 'supabase/functions/ido-supervisor/**'
      - 'supabase/migrations/*information_dividend*'
      - 'tests/information-dividend-contract.test.mjs'
      - '.github/workflows/information-dividend-ci.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Information Dividend contracts
        run: node tests/information-dividend-contract.test.mjs
      - name: Validate supervisor surfaces
        run: |
          grep -q 'id="workbench"' app/information-dividend.html
          grep -q 'id="rag"' app/information-dividend.html
          grep -q 'id="mlops"' app/information-dividend.html
          grep -q 'id="decisions"' app/information-dividend.html
          grep -q 'id="reports"' app/information-dividend.html
          grep -q 'id="workbench"' app/supervisor.html
          grep -q 'id="rag"' app/supervisor.html
          grep -q 'id="mlops"' app/supervisor.html
          grep -q 'id="outcomes"' app/supervisor.html
          grep -q 'id="reports"' app/supervisor.html
      - name: Syntax-check live supervisor JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('app/supervisor.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/ido-supervisor.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/ido-supervisor.js
