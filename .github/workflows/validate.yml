name: Validate Venture Contract
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate required product surface
        run: |
          test -f README.md
          test -f CONSTITUTION.md
          test -f KERNEL.md
          test -f REGRESSIONS.md
          test -f MAINTAINERS.md
          test -f app/index.html
          test -f app/demo.html
          test -f app/config.js
          test -f app/assets/app.js
          test -f app/assets/styles.css
          test -f data/scoreboard.json
          test -f data/experiments.json
          test -f contracts/lead.v1.schema.json
          test -f contracts/event.v1.schema.json
          python -m py_compile scripts/record_day.py scripts/venture_review.py
      - name: Run architecture fitness gate
        run: python scripts/architecture_fitness.py

      - name: Run kernel contract tests
        run: |
          python -m unittest discover -s tests -p 'test_kernel_contracts.py' -v
          python -m unittest discover -s tests -p 'test_outreach_generator.py' -v
          python -m unittest discover -s tests -p 'test_architecture_fitness.py' -v

  production-smoke:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: kernel-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run non-destructive production smoke tests
        env:
          VENTURE_PROD_URL: https://venture-architect-seven.vercel.app
        run: python -m unittest discover -s tests -p 'test_production_smoke.py' -v
